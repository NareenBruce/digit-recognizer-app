name: ML DevOps CI Pipeline

# This tells GitHub to run this workflow every time you push to the 'main' branch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab the code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Set up the exact Python version we used
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Install the dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run our automated test
      - name: Run Pytest
        run: |
          pytest

      # 5. If the test passes, build the Docker image (just to ensure it builds successfully in the cloud)
      - name: Build Docker Image
        run: |
          docker build -t digit-api:latest .
